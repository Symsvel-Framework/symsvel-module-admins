name: QA
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, sodium, intl
          coverage: none
          tools: composer:v2
      - name: Verify PHP 8.4
        run: |
          php -v
          php -r 'if (PHP_VERSION_ID < 80400 || PHP_VERSION_ID >= 80500) { exit(1); }'
      - name: Install public Composer dependencies
        env:
          SYMSVEL_READ_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SYMSVEL_READ_TOKEN" ]; then
            echo "::error::SYMSVEL_READ_TOKEN is missing. A read-only token for public SymSvel repositories is required."
            exit 1
          fi
          for repository in symsvel-module-auth symsvel-module-mails symsvel-module-settings symsvel-module-languages; do
            if ! curl --fail --silent --show-error --output /dev/null \
                --header "Authorization: Bearer $SYMSVEL_READ_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/Symsvel-Framework/$repository"; then
              echo "::error::SYMSVEL_READ_TOKEN cannot read public repository $repository (check repository URL and token permissions)."
              exit 1
            fi
          done
          export COMPOSER_AUTH="$(php -r 'echo json_encode(["github-oauth" => ["github.com" => getenv("SYMSVEL_READ_TOKEN")]], JSON_THROW_ON_ERROR);')"
          composer install --no-interaction --prefer-dist --no-progress
          composer audit --locked
      - name: Verify Auth development contract
        run: |
          composer show symsvel-framework/module-auth
          composer show symsvel-framework/module-mails
          composer show symsvel-framework/module-settings
          composer show symsvel-framework/module-languages
          php -r 'require "vendor/autoload.php"; if (!interface_exists("SymSvel\\Module\\Auth\\Identity\\PasswordResetIdentity")) { fwrite(STDERR, "Auth PasswordResetIdentity missing from installed dependency\\n"); exit(1); }'
      - run: composer qa

  bo-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Admins module
        uses: actions/checkout@v4
      - name: Checkout BO host on dev
        uses: actions/checkout@v4
        with:
          repository: Symsvel-Framework/symsvel-bo
          ref: dev
          path: assembled-bo
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: assembled-bo/package-lock.json
      - name: Assemble module routes like Tooling
        run: |
          mkdir -p assembled-bo/src/lib/modules/admins/routes/admins
          mkdir -p assembled-bo/src/routes/admins
          cp bo/src/lib/modules/admins/*.ts assembled-bo/src/lib/modules/admins/
          cp bo/src/routes/admins/+page.svelte assembled-bo/src/lib/modules/admins/routes/admins/+page.svelte
          mkdir -p assembled-bo/src/lib/translations/admins assembled-bo/tests
          cp bo/src/lib/translations/*.ts assembled-bo/src/lib/translations/admins/
          for route in profile verify-email-change documentation; do
            mkdir -p "assembled-bo/src/lib/modules/admins/routes/$route" "assembled-bo/src/routes/$route"
            cp "bo/src/routes/$route/+page.svelte" "assembled-bo/src/lib/modules/admins/routes/$route/+page.svelte"
            printf '<script lang="ts">\n  import ModulePage from "#lib/modules/admins/routes/%s/+page.svelte";\n</script>\n<ModulePage />\n' "$route" > "assembled-bo/src/routes/$route/+page.svelte"
          done
          cp bo/tests/documentation.test.ts assembled-bo/tests/admins-documentation.test.ts
          cat > assembled-bo/src/routes/admins/+page.svelte <<'ROUTE'
          <script lang="ts">
            import ModulePage from '#lib/modules/admins/routes/admins/+page.svelte';
          </script>
          <ModulePage />
          ROUTE
      - name: Install BO dependencies
        working-directory: assembled-bo
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and Ubuntu dependencies
        working-directory: assembled-bo
        run: npx playwright install --with-deps chromium
      - name: Format assembled BO (same convention as BO CI)
        working-directory: assembled-bo
        run: npm run format
      - name: Validate assembled BO types, style, build and unit tests
        working-directory: assembled-bo
        run: |
          npm run check
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
          npm run test:unit -- --run
